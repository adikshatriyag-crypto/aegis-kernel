[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-kernel"
version = "0.2.0"
authors = [
  { name="Aditya Verma", email="founder@aegiskernel.com" },
]
description = "Deterministic Zero-Trust Security Runtime for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/adikshatriyag-crypto/aegis-kernel"
"Bug Tracker" = "https://github.com/adikshatriyag-crypto/aegis-kernel/issues"
